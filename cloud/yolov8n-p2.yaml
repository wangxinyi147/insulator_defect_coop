# ==============================================
# YOLOv8n-P2 小目标检测增强架构
# 新增P2检测层（160×160），针对闪络等微小缺陷
# ==============================================

nc: 4
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                   # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                  # 1-P2/4
  - [-1, 3, C2f, [128, True]]                   # 2
  - [-1, 1, Conv, [256, 3, 2]]                  # 3-P3/8
  - [-1, 6, C2f, [256, True]]                   # 4
  - [-1, 1, Conv, [512, 3, 2]]                  # 5-P4/16
  - [-1, 6, C2f, [512, True]]                   # 6
  - [-1, 1, Conv, [1024, 3, 2]]                 # 7-P5/32
  - [-1, 3, C2f, [1024, True]]                  # 8
  - [-1, 1, SPPF, [1024, 5]]                    # 9
  - [-1, 1, CBAM, [256]]                       # 10 [新增] CBAM注意力

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]                          # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]                          # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # [新增] P2上采样
  - [[-1, 2], 1, Concat, [1]]                   # [新增] 融合backbone P2
  - [-1, 3, C2f, [128]]                          # 19 [新增] P2检测分支

  - [-1, 1, Conv, [128, 3, 2]]                  # [新增] P2下采样
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]                          # 22

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]                          # 25

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]                         # 28

  - [[19, 22, 25, 28], 1, Detect, [nc]]         # P2, P3, P4, P5
