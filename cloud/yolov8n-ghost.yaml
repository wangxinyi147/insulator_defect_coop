# ==============================================
# YOLOv8n-Ghost 轻量化架构
# 基于 yolov8n 标准架构，将 backbone 浅层 Conv 替换为 GhostConv
# 目标: 减少参数量，适配 Jetson Nano 算力限制
# ==============================================

# 参数
nc: 4
scales:
  n: [0.33, 0.25, 1024]

# Backbone（浅层 Conv → GhostConv 减少参数）
backbone:
  - [-1, 1, GhostConv, [64, 3, 2]]              # 0-P1/2  [替换]
  - [-1, 1, GhostConv, [128, 3, 2]]             # 1-P2/4  [替换]
  - [-1, 3, C2f, [128, True]]                   # 2
  - [-1, 1, Conv, [256, 3, 2]]                  # 3-P3/8
  - [-1, 6, C2f, [256, True]]                   # 4
  - [-1, 1, Conv, [512, 3, 2]]                  # 5-P4/16
  - [-1, 6, C2f, [512, True]]                   # 6
  - [-1, 1, Conv, [1024, 3, 2]]                 # 7-P5/32
  - [-1, 3, C2f, [1024, True]]                  # 8
  - [-1, 1, SPPF, [1024, 5]]                    # 9

# Head（与标准 yolov8n 相同）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]

  - [[15, 18, 21], 1, Detect, [nc]]
