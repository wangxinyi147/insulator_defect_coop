# ==============================================
# YOLOv8n-BiFPN 双向特征金字塔架构
# 增强跨尺度特征融合，提升多尺度缺陷检测性能
# ==============================================

nc: 4
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                   # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                  # 1-P2/4
  - [-1, 3, C2f, [128, True]]                   # 2
  - [-1, 1, Conv, [256, 3, 2]]                  # 3-P3/8
  - [-1, 6, C2f, [256, True]]                   # 4
  - [-1, 1, Conv, [512, 3, 2]]                  # 5-P4/16
  - [-1, 6, C2f, [512, True]]                   # 6
  - [-1, 1, Conv, [1024, 3, 2]]                 # 7-P5/32
  - [-1, 3, C2f, [1024, True]]                  # 8
  - [-1, 1, SPPF, [1024, 5]]                    # 9
  - [-1, 1, ECA, [256]]                        # 10 [新增] ECA高效注意力

head:
  # Top-down FPN
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]                          # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]                          # 16

  # Bottom-up PAN + BiFPN跨层连接
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13, 4], 1, Concat, [1]]               # [改进] BiFPN跨层：融合P4 backbone
  - [-1, 3, C2f, [512]]                          # 19

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10, 6], 1, Concat, [1]]               # [改进] BiFPN跨层：融合SPPF+backbone P4
  - [-1, 3, C2f, [1024]]                         # 22

  - [[16, 19, 22], 1, Detect, [nc]]             # P3, P4, P5
