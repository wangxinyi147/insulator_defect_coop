# ==============================================
# YOLOv8n-LSKA-CA 自定义架构
# 基于 yolov8n 标准架构，增加：
#   - CA (坐标注意力): 在 SPPF 之后，增强位置编码
#   - LSKA (大核可分离注意力): 在检测头前 P3/P4/P5 特征层
# 目标: 提升小目标（闪络、破损）的检测精度
# ==============================================

# 参数
nc: 4
scales:
  n: [0.33, 0.25, 1024]  # depth, width, max_channels

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                   # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                  # 1-P2/4
  - [-1, 3, C2f, [128, True]]                   # 2
  - [-1, 1, Conv, [256, 3, 2]]                  # 3-P3/8
  - [-1, 6, C2f, [256, True]]                   # 4
  - [-1, 1, Conv, [512, 3, 2]]                  # 5-P4/16
  - [-1, 6, C2f, [512, True]]                   # 6
  - [-1, 1, Conv, [1024, 3, 2]]                 # 7-P5/32
  - [-1, 3, C2f, [1024, True]]                  # 8
  - [-1, 1, SPPF, [1024, 5]]                    # 9
  - [-1, 1, CA, [256]]                         # 10 [新增] 坐标注意力增强

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]

  - [[15, 18, 21], 1, Detect, [nc]]
